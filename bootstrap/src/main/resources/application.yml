spring:
  application:
    name: lee-commerce
  datasource:
    url: jdbc:postgresql://localhost:5432/lee_commerce
    username: lee_commerce
    password: lee_commerce
  jpa:
    open-in-view: false
    hibernate:
      # db/schema.sql이 스키마의 단일 진실 소스다 — Hibernate가 테이블을 만들거나 바꾸지
      # 않고, 실행 시점에 매핑이 실제 스키마와 맞는지 검증만 한다.
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200

jwt:
  # 기본값을 두지 않는다 — 기본값이 있으면 JWT_SECRET을 안 넣어도 조용히 뜨는데, 그 값은
  # 저장소에 공개돼 있어서 누구나 같은 키로 유효한 토큰을 위조할 수 있게 된다.
  secret: ${JWT_SECRET}

catalog:
  api-key:
    # jwt.secret과 같은 이유로 기본값을 두지 않는다.
    value: ${CATALOG_API_KEY}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
